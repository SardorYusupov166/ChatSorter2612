plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = project.mod_version
group = 'dev.chatsorter'
base { archivesName = 'chatsorter' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach {
    // Legacy Yarn mixins may remain in GitHub after a browser-based upload.
    // Exclude them at the Gradle level to prevent obsolete classes from breaking the 26.1.2 build.
    exclude '**/mixin/ChatHudMixin.java', '**/mixin/ChatHudAccess.java'
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
